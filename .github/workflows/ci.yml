on:
  push:
  pull_request:

name: CI

env:
  CGO_ENABLED: "1"
  PKG_CONFIG_PATH: ${{ github.workspace }}/.native/libdave/linux/lib/pkgconfig
  LD_LIBRARY_PATH: ${{ github.workspace }}/.native/libdave/linux/lib

jobs:
  native:
    uses: ./.github/workflows/native.yml

  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: false
      - name: Code
        uses: actions/checkout@v7
      - name: Check diff between gofmt and code
        run: diff <(gofmt -d .) <(echo -n)

  test:
    needs: native
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go-version: ['1.26.8', stable]
    steps:
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Code
        uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: libdave-linux
          path: .native/libdave/linux
      - run: go test -v -count=1 -race ./...
      - uses: actions/download-artifact@v8
        if: matrix.go-version == '1.26.8'
        with:
          name: libdave-windows
          path: .native/libdave/windows
      - name: Cross-compile Windows
        if: matrix.go-version == '1.26.8'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-mingw-w64-x86-64
          GOOS=windows CC=x86_64-w64-mingw32-gcc PKG_CONFIG_PATH="$PWD/.native/libdave/windows/lib/pkgconfig" go build ./...

  lint:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: false
      - name: Code
        uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: libdave-linux
          path: .native/libdave/linux
      - name: Go vet
        run: go vet -x ./...
      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
